[project]
name = "learner"
version = "0.1.0"
description = "Autonomous PyTorch learner for MCTS actor-learner training pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.16.0",
    "pytest>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
